info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "admin@arqueo.local",
        "password": "Qx7mRt2kPw9nLz4v"
      }

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("TOKEN", res.body.accessToken)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Login

  Valida email y contraseña y devuelve un access token JWT. Es lo único que
  devuelve: el perfil del usuario se pide aparte a `GET /users/me`. Todavía no
  hay refresh token: cuando el access expira hay que volver a loguearse.

  **Auth:** public

  ## Request body
  ```json
  {
    "email": "ada@arqueo.local",
    "password": "Qx7mRt2kPw9nLz4v"
  }
  ```

  El email se recorta y se pasa a minúsculas en el DTO antes de validarse. El
  `ValidationPipe` global corre con `whitelist` y `forbidNonWhitelisted`, así
  que cualquier campo extra en el body hace fallar la request.

  ## Response 200
  ```json
  {
    "accessToken": "<jwt>"
  }
  ```

  La respuesta pasa por `@Serialize(LoginResponse)` (el de `auth/responses`):
  solo sale `accessToken`, sin envolver en `data`. Ningún dato del usuario, y
  el hash bcrypt menos.

  El token se firma con HS256 y su payload es `{ sub, iat, exp }`, donde `sub`
  es el id del usuario. El secreto y la expiración salen de
  `JWT_ACCESS_SECRET` y `JWT_ACCESS_EXPIRES_IN` (por defecto un día). Un
  script `after-response` lo guarda en la variable `{{TOKEN}}` de Bruno, que
  usan los endpoints protegidos como `Get Me`.

  Los usuarios desactivados (soft delete con `deletedAt`) no los encuentra
  `findByEmail`, así que no pueden loguearse. Un token ya emitido también deja
  de servir apenas desactivan o borran al usuario, porque `JwtAuthGuard` lo
  busca en la base en cada request. Lo que todavía no invalida los tokens
  abiertos es cambiar la contraseña.

  Si el email no existe, la request corta de inmediato; si existe, la
  contraseña se compara contra el hash bcrypt almacenado. Los dos casos
  devuelven el mismo error, pero no tardan lo mismo: un email registrado
  cuesta un `bcrypt.compare` (~300 ms) y uno inexistente no. Esa diferencia
  es observable desde afuera y permite enumerar qué correos tienen cuenta.

  ## Errors
  - `401 InvalidCredentialsError` — el email no corresponde a ningún usuario activo, o la contraseña no coincide. La respuesta es la misma en ambos casos, a propósito.
  - `400 BAD_REQUEST` — el body no es JSON válido; lo rechaza el body parser de Express antes de llegar al `ValidationPipe`.
  - `422 UNPROCESSABLE_ENTITY` — body inválido según el DTO: email con formato incorrecto, `password` vacío o ausente, o campos extra no permitidos.
  - `429 TOO_MANY_REQUESTS` — `ThrottlerGuard` global, más de 100 requests por minuto.
