info:
  name: Update Me
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{BASE_URL}}/users/me"
  body:
    type: json
    data: |-
      {
        "name": "Ada King"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Update Me

  Edita el perfil del usuario dueño del token. Es un update parcial: todos los
  campos del body son opcionales, y un body vacío devuelve el perfil sin
  cambios.

  **Auth:** Bearer token

  Lleva `@Auth("profile:update")`, un permiso que tienen todos los roles, así
  que en la práctica alcanza con tener sesión. El token lo hereda de la carpeta
  `Users` (`{{TOKEN}}`, que guarda `Login`).

  ## Request body
  ```json
  {
    "name": "Ada King"
  }
  ```

  Hoy el único campo editable es `name`. El email no se puede cambiar desde
  acá, solo lo cambia el admin (`PATCH /admin/users/:id`): mandar `email`, o
  cualquier otro campo, hace fallar la request por `forbidNonWhitelisted`. La
  contraseña se cambia en `Change Password`.

  ## Response 200
  ```json
  {
    "id": "<uuid>",
    "name": "Ada King",
    "email": "ada@arqueo.local"
  }
  ```

  Devuelve el perfil ya actualizado, con el mismo `UserResponse` que `Get Me`.
  Usa `UsersService.update`, el mismo que el admin, así que corre dentro de su
  transacción y solo sobre usuarios activos.

  ## Errors
  - `401 UNAUTHORIZED` — falta el header `Authorization`, el esquema no es `Bearer`, el token está mal formado, expiró o se firmó con otro secreto, o el usuario del token fue desactivado o borrado. Todos los casos responden igual.
  - `400 BAD_REQUEST` — el body no es JSON válido; lo rechaza el body parser de Express antes de llegar al `ValidationPipe`.
  - `422 UNPROCESSABLE_ENTITY` — body inválido según el DTO: `name` vacío o que no es string, o campos no permitidos como `email` o `isAdmin`: un usuario no puede cambiarse el email ni darse el rol de admin desde acá.
  - `429 TOO_MANY_REQUESTS` — `ThrottlerGuard` global, más de 100 requests por minuto.
