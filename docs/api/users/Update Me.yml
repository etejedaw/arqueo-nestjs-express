info:
  name: Update Me
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{BASE_URL}}/users/me"
  body:
    type: json
    data: |-
      {
        "name": "Ada King"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Update Me

  Edita el perfil del usuario dueño del token. Es un update parcial: todos los
  campos del body son opcionales, y un body vacío devuelve el perfil sin
  cambios.

  **Auth:** Bearer token

  ## Request body
  ```json
  {
    "name": "Ada King"
  }
  ```

  Hoy el único campo editable es `name`. El email no se puede cambiar desde
  acá, solo lo cambia el admin (`PATCH /admin/users/:id`): mandar `email`, o
  cualquier otro campo, hace fallar la request por `forbidNonWhitelisted`. La
  contraseña se cambia en `Change Password`.

  ## Response 200
  ```json
  {
    "id": "<uuid>",
    "name": "Ada King",
    "email": "ada@arqueo.local"
  }
  ```

  Devuelve el perfil ya actualizado, con el mismo `UserResponse` que `Get Me`.
  Usa `UsersService.update`, el mismo que el admin, así que corre dentro de su
  transacción y solo sobre usuarios activos.

  ## Errors
  - `401 UNAUTHORIZED` — sin token, token inválido o expirado, o usuario desactivado o borrado.
  - `400 BAD_REQUEST` — el body no es JSON válido; lo rechaza el body parser de Express antes de llegar al `ValidationPipe`.
  - `422 UNPROCESSABLE_ENTITY` — body inválido según el DTO: `name` vacío o que no es string, o campos no permitidos como `email`.
  - `429 TOO_MANY_REQUESTS` — `ThrottlerGuard` global, más de 100 requests por minuto.
