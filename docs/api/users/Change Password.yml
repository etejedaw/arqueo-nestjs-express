info:
  name: Change Password
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{BASE_URL}}/users/me/password"
  body:
    type: json
    data: |-
      {
        "password": "arriendo-marzo-475000"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Change Password

  Reemplaza la contraseña del usuario dueño del token por la que viene en el
  body. Es el cambio con sesión, distinto de la recuperación por correo
  (`/auth/reset-password`, Fase 6) y del reset que hace el admin
  (`POST /admin/users/:id/reset-password`).

  **Auth:** Bearer token

  ## Request body
  ```json
  {
    "password": "arriendo-marzo-475000"
  }
  ```

  `password` es obligatorio y no se recorta: una contraseña se guarda tal como
  llega. Todavía no hay largo mínimo.

  No pide la contraseña actual, a propósito: alcanza con tener sesión. La
  contrapartida es que cualquiera con un token válido de la cuenta (una sesión
  abierta en otro dispositivo, un token filtrado) puede cambiarla y dejar
  afuera al dueño.

  ## Response 204
  Sin body.

  `UsersService.changePassword` hashea `password` con bcrypt y guarda solo el
  hash. Los tokens ya emitidos siguen sirviendo hasta que expiran: cambiar la
  contraseña todavía no cierra las otras sesiones.

  ## Errors
  - `401 UNAUTHORIZED` — sin token, token inválido o expirado, o usuario desactivado o borrado.
  - `400 BAD_REQUEST` — el body no es JSON válido; lo rechaza el body parser de Express antes de llegar al `ValidationPipe`.
  - `422 UNPROCESSABLE_ENTITY` — body inválido según el DTO: falta `password`, viene vacío o no es string, o hay campos extra (por ejemplo `currentPassword`).
  - `429 TOO_MANY_REQUESTS` — `ThrottlerGuard` global, más de 100 requests por minuto.
