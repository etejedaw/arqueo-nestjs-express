docs: |-
  # Reset Password

  Genera una contraseña nueva para un usuario activo, reemplaza la anterior y
  la devuelve en claro una sola vez.

  **Auth:** Bearer token

  El token lo hereda de la carpeta `Admin`, que usa la variable `{{TOKEN}}` que
  guarda `Login` en su script `after-response`: hay que loguearse antes. El
  primer admin de una instancia vacía lo crea la API al arrancar
  (`admin@arqueo.local`, con la contraseña en el log de arranque).

  `AdminController` lleva `@Auth()` sobre la clase: exige sesión, pero todavía
  no revisa el rol. Cualquier usuario logueado, admin o no, puede llamar a este
  endpoint. Los permisos tienen que estar resueltos antes de cualquier
  despliegue.

  ## Path params
  - `id` (uuid) — id del usuario. `ParseUUIDPipe` lo valida antes de llegar al service; acepta UUID v3, v4, v5 y v7. En la colección es `{{USER_ID}}`, que setea `Create User` al crear un usuario.

  No lleva body.

  ## Response 200
  ```json
  {
    "password": "9f3a0c7e"
  }
  ```

  `password` son 8 caracteres hexadecimales (`0-9a-f`) generados en el
  servidor. Solo se guarda su hash bcrypt (cost 12), así que esta respuesta es
  la única vez que se puede ver; el administrador tiene que entregársela al
  usuario. La contraseña anterior deja de funcionar de inmediato. La respuesta
  viaja en claro, así que este endpoint exige TLS en cualquier despliegue real.

  Responde `200` y no `201` porque no crea ningún recurso. Está planificado que
  más adelante (Fase 6) la contraseña viaje al email del usuario en vez de
  mostrársela al admin.

  ## Errors
  - `401 UNAUTHORIZED` — falta el header `Authorization`, el esquema no es `Bearer`, el token está mal formado, expiró o se firmó con otro secreto, o el usuario del token fue desactivado o borrado. Todos los casos responden igual.
  - `400 BAD_REQUEST` — `id` no es un UUID válido (`Validation failed (uuid is expected)`).
  - `404 UserNotFoundError` — no existe ningún usuario activo con ese id; a un usuario desactivado no se le puede resetear la contraseña.
  - `429 TOO_MANY_REQUESTS` — `ThrottlerGuard` global, más de 100 requests por minuto.
