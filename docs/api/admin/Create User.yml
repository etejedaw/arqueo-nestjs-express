info:
  name: Create User
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/admin/users"
  body:
    type: json
    data: |-
      {
        "name": "Ada Lovelace",
        "email": "ada@arqueo.local",
        "isAdmin": false
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("USER_ID", res.body.id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Create User

  Da de alta un usuario con una contraseña generada por el servidor y devuelve
  sus datos junto a esa contraseña en claro. Reemplaza a
  `POST /auth/register`: no hay registro público, las cuentas las crea el
  administrador desde el módulo `admin`.

  **Auth:** Bearer token

  El token lo hereda de la carpeta `Admin`, que usa la variable `{{TOKEN}}` que
  guarda `Login` en su script `after-response`: hay que loguearse antes. El
  primer admin de una instancia vacía lo crea la API al arrancar
  (`admin@arqueo.local`, con la contraseña en el log de arranque).

  Lleva `@Auth("users:create")`: `JwtAuthGuard` exige sesión y después
  `PermissionsGuard` exige el permiso `users:create`. Solo el rol `admin` lo
  tiene, a través de `users:manage`; un usuario normal recibe 403.

  ## Request body
  ```json
  {
    "name": "Ada Lovelace",
    "email": "ada@arqueo.local",
    "isAdmin": false
  }
  ```

  Los tres campos son obligatorios, incluido `isAdmin`: el rol se decide
  explícitamente en cada alta, no hay un valor por defecto. El
  `ValidationPipe` global corre con `whitelist` y `forbidNonWhitelisted`, así
  que cualquier campo fuera de esos tres hace fallar la request, incluido
  `password`: la contraseña no se elige al dar de alta.

  El email se recorta y se pasa a minúsculas en el DTO con `@Trim()` y
  `@ToLowerCase()`, los mismos decoradores que usa `Login`, así que un alta con
  `Ada@Arqueo.local`, o con espacios alrededor, queda guardada como
  `ada@arqueo.local` y después puede iniciar sesión.

  ## Response 201
  ```json
  {
    "id": "<uuid>",
    "name": "Ada Lovelace",
    "email": "ada@arqueo.local",
    "isAdmin": false,
    "password": "9f3a0c7e"
  }
  ```

  `password` es la contraseña generada, en claro: 8 caracteres hexadecimales
  (`0-9a-f`). Solo se guarda su hash bcrypt (cost 12), así que esta respuesta
  es la única vez que se puede ver; el administrador tiene que entregársela al
  usuario. La respuesta viaja en claro, así que este endpoint exige TLS en
  cualquier despliegue real.

  La respuesta pasa por `@Serialize(CreatedUserResponse)`: solo salen `id`,
  `name`, `email`, `isAdmin` y la contraseña generada. El hash bcrypt nunca
  sale. La respuesta no se envuelve en `data`.

  Un script `after-response` guarda `id` en la variable `{{USER_ID}}`, que usan
  los demás endpoints de `admin`. Por eso conviene correrlo primero: el resto
  de la carpeta opera sobre el usuario recién creado.

  ## Errors
  - `401 UNAUTHORIZED` — falta el header `Authorization`, el esquema no es `Bearer`, el token está mal formado, expiró o se firmó con otro secreto, o el usuario del token fue desactivado o borrado. Todos los casos responden igual.
  - `403 FORBIDDEN` — el usuario del token no es admin: `PermissionsGuard` no encuentra el permiso en su rol.
  - `409 EmailAlreadyInUseError` — ya existe un usuario con ese email, incluido uno desactivado: `UsersService.create` lo busca con `withDeleted`.
  - `400 BAD_REQUEST` — el body no es JSON válido; lo rechaza el body parser de Express antes de llegar al `ValidationPipe`.
  - `422 UNPROCESSABLE_ENTITY` — body inválido según el DTO: `name` vacío, email con formato incorrecto, `isAdmin` ausente o no booleano, o campos extra no permitidos (incluido `password`).
  - `429 TOO_MANY_REQUESTS` — `ThrottlerGuard` global, más de 100 requests por minuto.
