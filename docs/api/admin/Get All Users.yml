info:
  name: Get All Users
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/admin/users"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Get All Users

  Lista todos los usuarios de la instancia, activos y desactivados, para el
  panel de administración.

  **Auth:** Bearer token

  El token lo hereda de la carpeta `Admin`, que usa la variable `{{TOKEN}}` que
  guarda `Login` en su script `after-response`: hay que loguearse antes. El
  primer admin de una instancia vacía lo crea la API al arrancar
  (`admin@arqueo.local`, con la contraseña en el log de arranque).

  Lleva `@Auth("users:read")`: `JwtAuthGuard` exige sesión y después
  `PermissionsGuard` exige el permiso `users:read`. Solo el rol `admin` lo
  tiene, a través de `users:manage`; un usuario normal recibe 403.

  ## Response 200
  ```json
  [
    {
      "id": "<uuid>",
      "name": "Ada Lovelace",
      "email": "ada@arqueo.local",
      "isAdmin": false,
      "createdAt": "2026-09-16T12:00:00.000Z",
      "updatedAt": "2026-09-16T12:00:00.000Z",
      "deletedAt": null
    },
    {
      "id": "<uuid>",
      "name": "Grace Hopper",
      "email": "grace@arqueo.local",
      "isAdmin": true,
      "createdAt": "2026-09-10T09:30:00.000Z",
      "updatedAt": "2026-09-15T18:00:00.000Z",
      "deletedAt": "2026-09-15T18:00:00.000Z"
    }
  ]
  ```

  Incluye a los desactivados (`UsersService.findAll("all")`): se reconocen
  porque `deletedAt` no es `null`. No hay paginación ni filtros.

  Cada usuario pasa por `@Serialize(UserResponse)`: salen todos los campos
  salvo `password`, sin envolver en `data`.

  ## Errors
  - `401 UNAUTHORIZED` — falta el header `Authorization`, el esquema no es `Bearer`, el token está mal formado, expiró o se firmó con otro secreto, o el usuario del token fue desactivado o borrado. Todos los casos responden igual.
  - `403 FORBIDDEN` — el usuario del token no es admin: `PermissionsGuard` no encuentra el permiso en su rol.
  - `429 TOO_MANY_REQUESTS` — `ThrottlerGuard` global, más de 100 requests por minuto.
