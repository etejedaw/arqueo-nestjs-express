http:
  method: PATCH
  url: "{{BASE_URL}}/admin/users/{{USER_ID}}/reactivate"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Reactivate User

  Reactiva a un usuario desactivado: vuelve a poder iniciar sesión con la
  contraseña que tenía.

  **Auth:** public

  Todavía no hay guard: el endpoint vive bajo `/admin` pero no exige sesión ni
  rol, así que hoy cualquiera puede llamarlo. Tiene que estar resuelto antes de
  cualquier despliegue.

  ## Path params
  - `id` (uuid) — id del usuario. `ParseUUIDPipe` lo valida antes de llegar al service; acepta UUID v3, v4, v5 y v7. En la colección es `{{USER_ID}}`, que setea `Create User` al crear un usuario.

  No lleva body.

  ## Response 204
  Sin body.

  Responde `204` tanto si el usuario estaba desactivado y se reactivó (se
  limpia `deletedAt`) como si ya estaba activo, en cuyo caso no se hace nada.
  A diferencia de `Deactivate User`, la respuesta no indica si hubo cambio.

  ## Errors
  - `400 BAD_REQUEST` — `id` no es un UUID válido (`Validation failed (uuid is expected)`).
  - `500 UserNotFoundError` — no existe ningún usuario con ese id, activo ni desactivado. Debería ser `404`, pero el filtro que traduce errores de dominio a HTTP (`src/common/errors`) todavía no existe y el error sale sin manejar.
  - `429 TOO_MANY_REQUESTS` — `ThrottlerGuard` global, más de 100 requests por minuto.
