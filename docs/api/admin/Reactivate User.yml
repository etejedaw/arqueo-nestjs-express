info:
  name: Reactivate User
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{BASE_URL}}/admin/users/{{USER_ID}}/reactivate"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Reactivate User

  Reactiva a un usuario desactivado: vuelve a poder iniciar sesión con la
  contraseña que tenía.

  **Auth:** Bearer token

  El token lo hereda de la carpeta `Admin`, que usa la variable `{{TOKEN}}` que
  guarda `Login` en su script `after-response`: hay que loguearse antes. El
  primer admin de una instancia vacía lo crea la API al arrancar
  (`admin@arqueo.local`, con la contraseña en el log de arranque).

  Lleva `@Auth("users:update")`: `JwtAuthGuard` exige sesión y después
  `PermissionsGuard` exige el permiso `users:update`. Solo el rol `admin` lo
  tiene, a través de `users:manage`; un usuario normal recibe 403.

  ## Path params
  - `id` (uuid) — id del usuario. `ParseUUIDPipe` lo valida antes de llegar al service; acepta UUID v3, v4, v5 y v7. En la colección es `{{USER_ID}}`, que setea `Create User` al crear un usuario.

  No lleva body.

  ## Response 204
  Sin body.

  Responde `204` tanto si el usuario estaba desactivado y se reactivó (se
  limpia `deletedAt`) como si ya estaba activo, en cuyo caso no se hace nada. La
  respuesta no indica si hubo cambio.

  ## Errors
  - `401 UNAUTHORIZED` — falta el header `Authorization`, el esquema no es `Bearer`, el token está mal formado, expiró o se firmó con otro secreto, o el usuario del token fue desactivado o borrado. Todos los casos responden igual.
  - `403 FORBIDDEN` — el usuario del token no es admin: `PermissionsGuard` no encuentra el permiso en su rol.
  - `400 BAD_REQUEST` — `id` no es un UUID válido (`Validation failed (uuid is expected)`).
  - `404 UserNotFoundError` — no existe ningún usuario con ese id, activo ni desactivado.
  - `429 TOO_MANY_REQUESTS` — `ThrottlerGuard` global, más de 100 requests por minuto.
